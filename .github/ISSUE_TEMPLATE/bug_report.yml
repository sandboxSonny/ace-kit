name: Bug report
description: Something doesn't work as the documentation says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we see it?
      description: The smallest code or steps that show it. A failing test is perfect.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ace Kit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework and version
      placeholder: "Astro 7.3, or React Router 7.18"
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.12"
