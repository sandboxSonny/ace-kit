name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets this workflow prove its identity to npm, which is how it publishes without a stored token (npm "trusted
  # publishing", set up on the package's page on npmjs.com), and lets npm record where each version was built.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@^11.5.1
      - run: npm ci
      # With pending changesets this opens (or updates) a "Version Packages" pull request. When that is merged
      # there are none left, so it publishes the new version to npm and tags it.
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "Version Packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token here on purpose: npm accepts this workflow's identity instead (see docs/releasing.md).
          NPM_CONFIG_PROVENANCE: "true"
