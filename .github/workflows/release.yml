name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets npm prove, publicly, that each version was built by this workflow from this repository (provenance).
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # With pending changesets this opens (or updates) a "Version Packages" pull request. When that is merged
      # there are none left, so it publishes the new version to npm and tags it.
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "Version Packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An npm token that may publish the @sandboxsonny scope: see docs/releasing.md.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
