version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Small upgrades arrive together as one pull request. A major version of anything is its own pull request, so
      # one that needs a deliberate look (a new Astro or Ace Kit major) doesn't hold back the rest.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
